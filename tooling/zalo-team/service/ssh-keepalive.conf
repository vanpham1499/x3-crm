# Install as /etc/ssh/sshd_config.d/40-x3-tunnel-keepalive.conf on the Zalo VPS.
# Validate with sshd -t, then reload (not restart) ssh.service.
# Both directions need keepalives: a vanished Windows client must not retain 9341.
# Applies to new SSH sessions; existing stale sessions need separate verification.
ClientAliveInterval 30
ClientAliveCountMax 3
