name: x3salescrm

services:
  postgres:
    image: postgres:16-alpine
    container_name: x3crm-db
    environment:
      POSTGRES_USER: x3crm
      POSTGRES_PASSWORD: x3crm123
      POSTGRES_DB: x3crm
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U x3crm']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: x3crm-backend-local
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: x3crm-backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: x3crm
      DB_USERNAME: x3crm
      DB_PASSWORD: x3crm123
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
      REVERB_APP_ID: x3crm-local
      REVERB_APP_KEY: x3crm-local-key
      REVERB_APP_SECRET: x3crm-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  reverb:
    image: x3crm-backend-local
    container_name: x3crm-reverb
    restart: unless-stopped
    environment:
      APP_ENV: local
      CACHE_STORE: file
      REVERB_APP_ID: x3crm-local
      REVERB_APP_KEY: x3crm-local-key
      REVERB_APP_SECRET: x3crm-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - '8080:8080'

  queue-worker:
    image: x3crm-backend-local
    container_name: x3crm-queue-worker
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: x3crm
      DB_USERNAME: x3crm
      DB_PASSWORD: x3crm123
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: x3crm-local
      REVERB_APP_KEY: x3crm-local-key
      REVERB_APP_SECRET: x3crm-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: php artisan queue:work database --queue=realtime,default --sleep=1 --tries=3 --timeout=60
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
      reverb:
        condition: service_started

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: x3crm-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
